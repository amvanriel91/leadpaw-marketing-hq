<button class="active" data-page="dashboard"><span class="ico">⌂</span>Overview</button><button data-page="research"><span class="ico">⌕</span>Research & prospects</button><button data-page="content"><span class="ico">✦</span>Content studio</button><button data-page="campaigns"><span class="ico">◈</span>Campaigns</button><button data-page="calendar"><span class="ico">▦</span>Content calendar</button><button data-page="brand"><span class="ico">◉</span>Brand library</button></nav></div><div class="sidebar-foot">LeadPaw · Private workspace<br>Local-first edition · v0.1</div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="crumb" id="crumb">WORKSPACE / OVERVIEW</div><div class="top-actions"><span class="pill">● Local data saved in this browser</span><div class="avatar">A</div></div></header><div class="content" id="view"></div></main></div><div id="modalRoot"></div>
<script>
const STORE='leadpawMarketingHQ_v1';
const initial={prospects:[],campaigns:[],content:[],tasks:[],brand:{name:'LeadPaw',audience:'Independent pet and equine professionals',purpose:'Simple, practical software that helps independent pet and equine professionals keep their business organised.',voice:'Clear, supportive, conversational and professional.'}};
let db=load();function load(){try{return {...initial,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{return structuredClone(initial)}}function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(err){alert('Your browser blocked local storage. Try opening this file in Chrome or Edge, or enable site data for local files.');}render()}
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);let page='dashboard';
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
function head(k,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,val,note){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${val}</div><div class="stat-note">${note}</div></div>`}
function render(){let names={dashboard:'OVERVIEW',research:'RESEARCH & PROSPECTS',content:'CONTENT STUDIO',campaigns:'CAMPAIGNS',calendar:'CONTENT CALENDAR',brand:'BRAND LIBRARY'};$('#crumb').textContent='WORKSPACE / '+names[page];$('#view').innerHTML=({dashboard:dashboard,research:research,content:content,campaigns:campaigns,calendar:calendar,brand:brand}[page])()}
function dashboard(){let active=db.prospects.filter(p=>!['Converted','Not interested'].includes(p.status)).length;let interested=db.prospects.filter(p=>['Interested','Demo requested','Trial started'].includes(p.status)).length;let upcoming=db.content.filter(c=>c.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return `${head('LEADPAW MARKETING HQ','Good marketing starts with knowing who you’re talking to.','Your workspace for prospect research, persuasive content and focused campaigns.','<button class="btn primary" onclick="go(\'content\')">＋ Create content</button>')}<div class="grid stats">${stat('Prospects tracked',db.prospects.length,'Your researched lead list')}${stat('Active opportunities',active,'Prospects still in progress')}${stat('Interested prospects',interested,'Warm conversations')}${stat('Campaigns',db.campaigns.length,'Campaigns in your workspace')}</div><div class="grid cols"><section class="card"><h3 class="section-title">Your next marketing moves</h3><div class="task"><span class="task-dot"></span><div><strong>Build a focused prospect list</strong><p>Start with one segment, such as canine physiotherapists, and record source links for every lead.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Create one useful piece of content</strong><p>Lead with a real admin problem your audience recognises. Keep the product benefit concrete.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Follow up thoughtfully</strong><p>Track who has been contacted and when. Avoid sending generic bulk messages.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Learn from every response</strong><p>Capture objections, existing tools and language customers use to describe their problems.</p></div></div></section><section class="card"><h3 class="section-title">Quick launch</h3><div class="quick-grid"><button class="quick" onclick="go('research')"><i>⌕</i><b>Research prospects</b><span>Build a source-backed lead list.</span></button><button class="quick" onclick="go('content')"><i>✦</i><b>Write better copy</b><span>Build briefs and copy prompts.</span></button><button class="quick" onclick="go('campaigns')"><i>◈</i><b>Plan a campaign</b><span>Turn an idea into a plan.</span></button><button class="quick" onclick="go('calendar')"><i>▦</i><b>Plan content</b><span>Organise upcoming posts.</span></button></div></section></div><section class="card" style="margin-top:16px"><h3 class="section-title">Upcoming content</h3>${upcoming.length?upcoming.map(c=>`<div class="task"><span class="task-dot"></span><div><strong>${esc(c.title)}</strong><p>${esc(c.date)} · ${esc(c.channel)} · ${esc(c.status||'Draft')}</p></div></div>`).join(''):'<div class="empty">Nothing scheduled yet. Add your first post to the content calendar.</div>'}</section><div class="footer-note">This first edition stores information in this browser only. Export regular backups from Settings & data (Brand Library).</div>`}
function research(){return `${head('INTELLIGENCE','Research & prospects','Keep a clean, evidence-led record of businesses you may want to approach. Add only details you can verify.','<button class="btn primary" onclick="prospectModal()">＋ Add prospect</button>')}<div class="notice"><b>Research integrity:</b> This version is a prospect CRM, not an autonomous web scraper. Research businesses using public sources, then record the source URL and distinguish verified facts from your own hypotheses.</div><div class="toolbar"><input class="field" style="max-width:260px" id="pSearch" placeholder="Search businesses or people…" oninput="filterProspects()"><select class="field" style="max-width:180px" id="pFilter" onchange="filterProspects()"><option value="">All statuses</option>${['New','Researched','Contacted','Responded','Interested','Demo requested','Trial started','Converted','Not interested','Follow-up required'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Business / contact</th><th>Profession</th><th>Location</th><th>Status</th><th>Next follow-up</th><th>Source</th><th></th></tr></thead><tbody id="prospectRows">${prospectRows(db.prospects)}</tbody></table></div><p class="footer-note">Tip: prioritise one customer segment at a time. A smaller list of well-researched prospects is more useful than a large, poorly qualified list.</p>`}
function prospectRows(arr){return arr.length?arr.map((p,i)=>`<tr><td><strong>${esc(p.business)}</strong><br><span class="muted">${esc(p.contact||'No contact recorded')}</span></td><td>${esc(p.profession||'—')}</td><td>${esc(p.location||'—')}</td><td><span class="tag ${p.status==='Interested'||p.status==='Demo requested'?'gold':''}">${esc(p.status)}</span></td><td>${esc(p.followup||'—')}</td><td>${p.source?`<a href="${esc(p.source)}" target="_blank" rel="noopener">Open source ↗</a>`:'—'}</td><td><button class="btn" onclick="editProspect(${i})">Edit</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">No prospects yet. Add your first researched business.</div></td></tr>'}
function filterProspects(){let q=($('#pSearch')?.value||'').toLowerCase(),f=$('#pFilter')?.value||'';let arr=db.prospects.filter(p=>(!f||p.status===f)&&[p.business,p.contact,p.profession,p.location].join(' ').toLowerCase().includes(q));$('#prospectRows').innerHTML=prospectRows(arr)}
function prospectModal(idx=null){let p=idx===null?{}:db.prospects[idx];modal('Add prospect',`<form id="prospectForm" class="form-grid"><div><label>Business name *</label><input class="field" name="business" required value="${esc(p.business)}"></div><div><label>Contact person</label><input class="field" name="contact" value="${esc(p.contact)}"></div><div><label>Profession / specialisation</label><input class="field" name="profession" placeholder="Canine physiotherapist" value="${esc(p.profession)}"></div><div><label>Location</label><input class="field" name="location" placeholder="Cape Town, South Africa" value="${esc(p.location)}"></div><div><label>Public email / phone</label><input class="field" name="contactDetails" value="${esc(p.contactDetails)}"></div><div><label>Status</label><select class="field" name="status">${['New','Researched','Contacted','Responded','Interested','Demo requested','Trial started','Converted','Not interested','Follow-up required'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Next follow-up</label><input class="field" type="date" name="followup" value="${esc(p.followup)}"></div><div><label>Source URL</label><input class="field" name="source" type="url" placeholder="https://…" value="${esc(p.source)}"></div><div class="full"><label>Verified business details</label><textarea name="details" placeholder="What does the business offer? What did you actually verify?">${esc(p.details)}</textarea></div><div class="full"><label>Potential fit / outreach angle (hypothesis)</label><textarea name="angle" placeholder="Why might LeadPaw be relevant? Label assumptions clearly.">${esc(p.angle)}</textarea></div><div class="full"><label>Contact history / notes</label><textarea name="notes">${esc(p.notes)}</textarea></div><div class="full" style="display:flex;justify-content:space-between"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save prospect</button></div></form>`);$('#prospectForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(idx===null)db.prospects.unshift(obj);else db.prospects[idx]=obj;closeModal();save()}}
function editProspect(i){prospectModal(i)}
function content(){return `${head('CREATIVE WORKSHOP','Content studio','Build a strong creative brief, then use it with a free AI assistant. Keep every asset anchored in the LeadPaw brand.')}<div class="notice"><b>How this free version works:</b> This studio creates structured, reusable prompts and content briefs. It does not call paid AI APIs or generate images itself. Copy the prompt into an AI tool you already have access to; image-generation availability depends on that tool’s free-tier limits.</div><div class="split"><section class="card"><h3 class="section-title">Create a content brief</h3><div class="form-grid"><div class="full"><label>What are you creating?</label><select class="field" id="ctype"><option>Facebook group post</option><option>Instagram carousel</option><option>Instagram post</option><option>Facebook advertisement</option><option>Landing page</option><option>Newsletter</option><option>Blog article</option><option>Reel / short video script</option><option>WhatsApp outreach</option><option>LinkedIn post</option></select></div><div class="full"><label>Audience</label><input class="field" id="caudience" value="Independent canine physiotherapists and rehabilitation professionals"></div><div class="full"><label>Customer problem or topic</label><textarea id="ctopic" placeholder="Describe the real problem, question or opportunity this content should address…"></textarea></div><div><label>Primary objective</label><select class="field" id="cgoal"><option>Start conversations</option><option>Generate leads</option><option>Build trust</option><option>Explain product value</option><option>Drive website visits</option><option>Convert trials</option></select></div><div><label>Tone</label><select class="field" id="ctone"><option>Human, confident and conversational</option><option>Warm and educational</option><option>Direct and persuasive</option><option>Professional and reassuring</option><option>Curiosity-driven</option></select></div><div class="full"><label>Call to action</label><input class="field" id="ccta" value="Invite the reader to learn more about LeadPaw"></div><div class="full"><button class="btn primary" onclick="makePrompt()" type="button">✦ Build my creative brief</button></div></div></section><section class="card"><h3 class="section-title">Your AI-ready brief</h3><p class="hint">A detailed prompt that carries the brand, audience and objective into your chosen AI assistant.</p><div id="promptOutput" class="output">Your brief will appear here when you complete the fields and select “Build my creative brief”.</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sage" onclick="copyPrompt()">Copy prompt</button><button class="btn" onclick="saveContentPrompt()">Save to library</button></div></section></div><section class="card" style="margin-top:16px"><h3 class="section-title">Saved content briefs</h3>${db.content.filter(x=>x.prompt).length?db.content.filter(x=>x.prompt).map((x,i)=>`<div class="task"><span class="task-dot"></span><div style="flex:1"><strong>${esc(x.title)}</strong><p>${esc(x.date)} · ${esc(x.channel)}</p></div><button class="btn" onclick="showSavedPrompt(${i})">View</button></div>`).join(''):'<div class="empty">Your saved briefs will appear here.</div>'}</section>`}
let currentPrompt='';function makePrompt(){let type=$('#ctype').value,a=$('#caudience').value,t=$('#ctopic').value,g=$('#cgoal').value,tone=$('#ctone').value,cta=$('#ccta').value;if(!t.trim()){alert('Add a topic or customer problem first.');return}currentPrompt=`You are a senior marketing strategist and exceptional creative copywriter working for LeadPaw. Create a ${type} for the brand.\n\nAUDIENCE: ${a}\nTOPIC / CUSTOMER PROBLEM: ${t}\nOBJECTIVE: ${g}\nTONE: ${tone}\nCALL TO ACTION: ${cta}\n\nLEADPAW BRAND CONTEXT\nLeadPaw helps independent pet and equine professionals keep their business organised with simple, practical software. Brand feeling: calm, trustworthy, organised, friendly and professional. Voice: clear, supportive, conversational. Avoid generic SaaS buzzwords, corporate stock aesthetics, clutter, gimmicks and exaggerated claims. Lead with the customer's problem before the product. Prefer real product screenshots and authentic pet professionals. Brand colours: charcoal #2A3736, sage #759178, dark green #263B3E, light green #95C38E, cream #FAF3E9 and white. Headings: Poppins or Manrope; body: Inter.\n\nQUALITY REQUIREMENTS\n- Make the output specific to this audience, not generic small-business marketing.\n- Use natural, intelligent language that sounds human.\n- Focus on a real customer problem and a concrete benefit.\n- Do not invent statistics, testimonials, customer results, product features or claims. If information is missing, flag it rather than guessing.\n- Give me a strong first draft, then critique it for clarity, relevance, credibility and conversion potential. Improve weak sections before presenting the final version.\n- Include the recommended visual direction and exact on-image text if relevant.\n- Make the final output ready to use, with any assumptions clearly identified.`;$('#promptOutput').textContent=currentPrompt}
function copyPrompt(){if(!currentPrompt)return alert('Build a brief first.');navigator.clipboard?.writeText(currentPrompt).then(()=>alert('Prompt copied.')).catch(()=>alert('Select and copy the prompt manually.'))}
function saveContentPrompt(){if(!currentPrompt)return alert('Build a brief first.');db.content.unshift({title:$('#ctype').value+' — '+($('#ctopic').value.slice(0,45)),date:today(),channel:$('#ctype').value,status:'Brief',prompt:currentPrompt});save();alert('Brief saved to your library.')}
function showSavedPrompt(i){let a=db.content.filter(x=>x.prompt)[i];modal(a.title,`<div class="output">${esc(a.prompt)}</div><button class="btn sage" style="margin-top:12px" onclick="copySavedPrompt(${i})">Copy prompt</button>`)}function copySavedPrompt(i){let a=db.content.filter(x=>x.prompt)[i];navigator.clipboard?.writeText(a.prompt).then(()=>alert('Copied.')).catch(()=>alert('Select and copy the prompt manually.'))}
function campaigns(){return `${head('PLANNING','Campaigns','Turn marketing ideas into organised, measurable campaigns. Keep objectives, audiences and next actions clear.','<button class="btn primary" onclick="campaignModal()">＋ New campaign</button>')}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${db.campaigns.length?db.campaigns.map((c,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><span class="tag">${esc(c.status)}</span><button class="btn" onclick="editCampaign(${i})">Edit</button></div><h3 class="section-title" style="margin-top:15px">${esc(c.name)}</h3><p class="hint">${esc(c.audience)}</p><p class="hint"><b>Objective:</b> ${esc(c.objective)}</p><p class="hint"><b>Key message:</b> ${esc(c.message||'Not set')}</p><p class="hint"><b>Next action:</b> ${esc(c.next||'Not set')}</p></div>`).join(''):'<div class="card empty">No campaigns yet. Create one to organise your next marketing push.</div>'}</div>`}
function campaignModal(i=null){let c=i===null?{}:db.campaigns[i];modal('Campaign planner',`<form id="campaignForm" class="form-grid"><div class="full"><label>Campaign name *</label><input class="field" name="name" required value="${esc(c.name)}" placeholder="e.g. Canine physio discovery campaign"></div><div><label>Audience</label><input class="field" name="audience" value="${esc(c.audience)}"></div><div><label>Status</label><select class="field" name="status">${['Planning','In progress','Paused','Completed'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="full"><label>Objective</label><textarea name="objective" placeholder="What should this campaign achieve?">${esc(c.objective)}</textarea></div><div class="full"><label>Core message</label><textarea name="message" placeholder="What is the one thing the audience should understand?">${esc(c.message)}</textarea></div><div class="full"><label>Next action</label><input class="field" name="next" value="${esc(c.next)}"></div><div><label>Start date</label><input class="field" type="date" name="start" value="${esc(c.start)}"></div><div><label>End date</label><input class="field" type="date" name="end" value="${esc(c.end)}"></div><div class="full" style="display:flex;justify-content:space-between"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save campaign</button></div></form>`);$('#campaignForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(i===null)db.campaigns.unshift(o);else db.campaigns[i]=o;closeModal();save()}}
function editCampaign(i){campaignModal(i)}
function calendar(){let date=new Date(),y=date.getFullYear(),m=date.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div class="day"></div>';for(let d=1;d<=days;d++){let iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=db.content.filter(c=>c.date===iso);cells+=`<div class="day"><b>${d}</b>${events.map(e=>`<div class="event">${esc(e.title)}</div>`).join('')}</div>`}return `${head('PUBLISHING','Content calendar','A simple planning view for posts, campaigns and content deadlines.','<button class="btn primary" onclick="contentModal()">＋ Schedule content</button>')}<div class="card"><h3 class="section-title">${date.toLocaleString('en-ZA',{month:'long',year:'numeric'})}</h3><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="day" style="min-height:auto;background:#f6f8f5;font-weight:700">${d}</div>`).join('')}${cells}</div></div><section class="card" style="margin-top:16px"><h3 class="section-title">Planned content</h3>${db.content.filter(c=>!c.prompt).length?db.content.filter(c=>!c.prompt).sort((a,b)=>a.date.localeCompare(b.date)).map((c,i)=>`<div class="task"><span class="task-dot"></span><div style="flex:1"><strong>${esc(c.title)}</strong><p>${esc(c.date)} · ${esc(c.channel)} · ${esc(c.status)}</p></div><button class="btn" onclick="deleteContent(${i})">Remove</button></div>`).join(''):'<div class="empty">No content scheduled. Add your first post.</div>'}</section>`}
function contentModal(){modal('Schedule content',`<form id="scheduleForm" class="form-grid"><div class="full"><label>Content title *</label><input class="field" name="title" required></div><div><label>Date</label><input class="field" name="date" type="date" value="${today()}" required></div><div><label>Channel</label><select class="field" name="channel"><option>Facebook</option><option>Instagram</option><option>LinkedIn</option><option>Email newsletter</option><option>Blog</option><option>Other</option></select></div><div><label>Status</label><select class="field" name="status"><option>Idea</option><option>Draft</option><option>Ready for review</option><option>Approved</option><option>Published</option></select></div><div class="full"><label>Notes</label><textarea name="notes"></textarea></div><div class="full" style="display:flex;justify-content:space-between"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save to calendar</button></div></form>`);$('#scheduleForm').onsubmit=e=>{e.preventDefault();db.content.push({...Object.fromEntries(new FormData(e.target)),prompt:null});closeModal();save()}}
function deleteContent(i){let arr=db.content.filter(x=>!x.prompt);let item=arr[i];db.content.splice(db.content.indexOf(item),1);save()}

AAAAAAAAAAAAAAArBH/DzsPSJ49f7IZAAAAAElFTkSuQmCC" alt="LeadPaw logo" style="width:min(260px,100%);margin:10px 0 20px"><p class="hint">${esc(b.purpose)}</p><div class="brand-colors" style="margin-top:20px">${[['#2A3736','Charcoal'],['#759178','Sage'],['#FFFFFF','White'],['#263B3E','Dark green'],['#95C38E','Light green'],['#FAF3E9','Cream']].map(([c,n])=>`<div class="swatch"><div style="background:${c}"></div><small>${n}<br>${c}</small></div>`).join('')}</div></section><section class="card"><h3 class="section-title">Brand rules</h3><div class="task"><span class="task-dot"></span><div><strong>Voice</strong><p>Clear, supportive, conversational and professional. Avoid generic SaaS language and buzzwords.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Visual style</strong><p>Clean layouts, white backgrounds, rounded corners, minimal text, strong headlines and generous whitespace.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Photography</strong><p>Use authentic pet professionals and animals. Prefer real product screenshots over mock-ups.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Do not</strong><p>Stretch or recolour the logo. Avoid clutter, gimmicks, corporate stock imagery and exaggerated claims.</p></div></div><div class="task"><span class="task-dot"></span><div><strong>Bumble & Troy</strong><p>Can appear naturally to add warmth, but should never overpower the product.</p></div></div></section></div><section class="card" style="margin-top:16px"><h3 class="section-title">Workspace data</h3><p class="hint">Your prospects, campaign plans and content records are stored locally in this browser. Export a backup before clearing browser data or switching devices.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" onclick="backup()">Download backup (JSON)</button><label class="btn" style="margin:0;cursor:pointer">Restore backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label><button class="btn" onclick="exportCSV()">Export prospects (CSV)</button><button class="btn" onclick="clearData()">Clear workspace data</button></div></section><div class="footer-note">Brand reference: LeadPaw Brand Book v1.0 supplied in this project.</div>`}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leadpaw-marketing-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db={...initial,...JSON.parse(r.result)};save();alert('Backup restored.')}catch{alert('That backup file could not be read.')}};r.readAsText(f)}function exportCSV(){let rows=[['Business','Contact','Profession','Location','Public contact','Status','Follow-up','Source','Verified details','Potential fit','Notes'],...db.prospects.map(p=>['business','contact','profession','location','contactDetails','status','followup','source','details','angle','notes'].map(k=>p[k]||''))];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='leadpaw-prospects.csv';a.click();URL.revokeObjectURL(a.href)}function clearData(){if(confirm('Delete all locally stored prospects, campaigns and content? Download a backup first if you may need this data.')){db=structuredClone(initial);save()}}
try{render()}catch(err){document.querySelector('#view').innerHTML='<section class=card><h1>LeadPaw Marketing HQ could not start</h1><p>Please reopen this file in Chrome or Edge. Error: '+String(err).replace(/[&<>]/g,'')+'</p></section>';console.error(err)}
